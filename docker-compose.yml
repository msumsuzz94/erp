version: '3.8'

services:
  # PHP + Apache
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html/erp
      - ./uploads:/var/www/html/erp/uploads
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=erp_db
      - DB_USER=root
      - DB_PASS=root
    networks:
      - erp-net

  # MySQL
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: erp_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - erp-net

  # Python CCTV Middleware
  cctv:
    build:
      context: ./python
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    volumes:
      - ./uploads/biometrics:/app/biometrics:ro
    environment:
      - PHP_API_URL=http://web/erp/api/attendance/cctv-push.php
    depends_on:
      - web
    networks:
      - erp-net

volumes:
  mysql_data:

networks:
  erp-net:
    driver: bridge
